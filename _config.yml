# Site settings. Change these and every page updates.
title: Fabian Hansson Vallgren
description: Game developer working in Unity and C#. Games, playable builds and write-ups of the systems behind them.
url: https://mrbazingah.github.io
lang: en

# Links used in the header, footer and About page.
links:
  github: https://github.com/mrbazingah
  itch: https://mrbazinga.itch.io
  # email: you@example.com
  # linkedin: https://www.linkedin.com/in/your-name

# Default image when a page is shared (LinkedIn, Discord...). Use a 1200x630 or 1280x720 image.
# share_image: /assets/share.jpg

# Every file in _projects/ is one project. Its `category:` (school or personal)
# decides which page it shows up on.
collections:
  projects:
    output: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
